# Edge reverse-proxy baseline for HRMIS (place Cloudflare/WAF in front of this origin).
upstream hrmis_app {
    server web:8000;
    keepalive 32;
}

limit_req_zone $binary_remote_addr zone=hrmis_api:10m rate=20r/s;

server {
    listen 80;
    server_name _;

    client_max_body_size 12m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location /api/ {
        limit_req zone=hrmis_api burst=40 nodelay;
        proxy_pass http://hrmis_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location / {
        proxy_pass http://hrmis_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
