name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_loadtest_soak:
        description: 'Run longer Locust soak (3m) instead of short smoke'
        required: false
        default: 'false'

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hrmis
          POSTGRES_PASSWORD: hrmis
          POSTGRES_DB: hrmis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hrmis -d hrmis_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt pip-audit bandit
      - name: Dependency vulnerability scan
        if: matrix.database == 'sqlite'
        run: |
          if [ -f security/pip-audit-ignore.txt ]; then
            IGNORE_ARGS=$(grep -v '^#' security/pip-audit-ignore.txt | grep -v '^$' | sed 's/^/--ignore-vuln /' | tr '\n' ' ')
          else
            IGNORE_ARGS=""
          fi
          pip-audit -r requirements.txt --progress-spinner off $IGNORE_ARGS
      - name: Bandit SAST
        if: matrix.database == 'sqlite'
        run: >
          python -m bandit -r api accounts attendance employees leaves payroll
          recruitment compliance events avvento_hrmis
          -ll -c security/bandit.yaml
          --exclude api/tests,accounts/tests,*/migrations/*
      - name: Run API tests (${{ matrix.database }})
        run: python manage.py test api.tests events accounts.tests
        env:
          SECRET_KEY: test-secret-key-not-for-production
          ENFORCE_MFA_FOR_ADMINS: 'False'
          ENFORCE_MFA_FOR_MANAGERS: 'False'
          ENFORCE_MFA_FOR_PAYROLL: 'False'
          REQUIRE_FIELD_ENCRYPTION_KEY: 'False'
          FIELD_ENCRYPTION_KEY: test-field-encryption-key-for-ci
          DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://hrmis:hrmis@localhost:5432/hrmis_test?sslmode=disable' || '' }}

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: npm audit
        run: npm audit --omit=dev --audit-level=high
      - run: npm run test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Prepare database and seed users
        run: |
          python manage.py migrate --noinput
          python manage.py seed_data
        env:
          SECRET_KEY: test-secret-key-not-for-production
          ENFORCE_MFA_FOR_ADMINS: 'False'
          ENFORCE_MFA_FOR_MANAGERS: 'False'
          ENFORCE_MFA_FOR_PAYROLL: 'False'
          REQUIRE_FIELD_ENCRYPTION_KEY: 'False'
          FIELD_ENCRYPTION_KEY: test-field-encryption-key-for-ci
      - name: Build frontend for Django SPA
        working-directory: frontend
        run: npm ci && npm run build
      - name: Install Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start Django (API + built SPA)
        run: |
          python manage.py runserver 127.0.0.1:8000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/v1/health/ && break
            sleep 2
          done
        env:
          SECRET_KEY: test-secret-key-not-for-production
          ENFORCE_MFA_FOR_ADMINS: 'False'
          ENFORCE_MFA_FOR_MANAGERS: 'False'
          ENFORCE_MFA_FOR_PAYROLL: 'False'
          REQUIRE_FIELD_ENCRYPTION_KEY: 'False'
          FIELD_ENCRYPTION_KEY: test-field-encryption-key-for-ci
      - name: Run Playwright E2E
        working-directory: frontend
        run: npm run e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:8000
          E2E_PYTHON: python

  zap:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Migrate and start server
        run: |
          python manage.py migrate --noinput
          python manage.py runserver 127.0.0.1:8000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/v1/health/ && break
            sleep 2
          done
        env:
          SECRET_KEY: test-secret-key-not-for-production
          ENFORCE_MFA_FOR_ADMINS: 'False'
          ENFORCE_MFA_FOR_MANAGERS: 'False'
          ENFORCE_MFA_FOR_PAYROLL: 'False'
          REQUIRE_FIELD_ENCRYPTION_KEY: 'False'
          FIELD_ENCRYPTION_KEY: test-field-encryption-key-for-ci
          DEBUG: 'True'
      - name: OWASP ZAP baseline
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://127.0.0.1:8000'
          fail_action: true
          allow_issue_writing: false
          rules_file_name: 'rules.tsv'
          cmd_options: '-a'

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  loadtest:
    # Short smoke on every main push; optional longer soak via workflow_dispatch.
    if: >
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt locust
      - name: Migrate, seed, start
        run: |
          python manage.py migrate --noinput
          python manage.py seed_data
          python manage.py runserver 127.0.0.1:8000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/v1/health/ && break
            sleep 2
          done
        env:
          SECRET_KEY: test-secret-key-not-for-production
          ENFORCE_MFA_FOR_ADMINS: 'False'
          ENFORCE_MFA_FOR_MANAGERS: 'False'
          ENFORCE_MFA_FOR_PAYROLL: 'False'
          REQUIRE_FIELD_ENCRYPTION_KEY: 'False'
          FIELD_ENCRYPTION_KEY: test-field-encryption-key-for-ci
      - name: Locust smoke / soak
        env:
          # Ephemeral CI SQLite is slower than staging; keep smoke useful but not flaky.
          LOADTEST_MAX_ERROR_RATE: '0.01'
          LOADTEST_MAX_MEDIAN_MS: '2000'
          LOADTEST_MAX_P95_MS: '4000'
          LOADTEST_MIN_REQUESTS: '10'
        run: |
          DURATION=30s
          USERS=5
          if [ "${{ github.event.inputs.run_loadtest_soak }}" = "true" ]; then
            DURATION=3m
            USERS=10
          fi
          mkdir -p loadtest/artifacts
          locust -f loadtest/locustfile.py --host http://127.0.0.1:8000 \
            --headless -u "$USERS" -r 2 -t "$DURATION" \
            --csv=loadtest/artifacts/results --html=loadtest/artifacts/results.html \
            --only-summary
      - name: Record loadtest evidence
        if: success()
        run: >
          python manage.py record_loadtest_evidence --ok
          --notes "CI ${{ github.sha }} loadtest"
          --url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          SECRET_KEY: test-secret-key-not-for-production
          REQUIRE_FIELD_ENCRYPTION_KEY: 'False'
          FIELD_ENCRYPTION_KEY: test-field-encryption-key-for-ci
      - name: Upload Locust artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locust-results
          path: loadtest/artifacts/
          if-no-files-found: ignore
