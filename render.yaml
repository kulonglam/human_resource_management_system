services:
  - type: web
    name: human-resource-management-system
    runtime: python
    plan: free
    buildCommand: bash scripts/render-build.sh
    preDeployCommand: >-
      python manage.py migrate --noinput &&
      python manage.py bootstrap_admin &&
      python manage.py seed_workflows &&
      python manage.py seed_document_access
    startCommand: gunicorn avvento_hrmis.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/v1/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: ALLOW_PUBLIC_REGISTRATION
        value: "False"
      - key: ENFORCE_MFA_FOR_ADMINS
        value: "True"
      - key: ENFORCE_MFA_FOR_MANAGERS
        value: "True"
      - key: ENFORCE_MFA_FOR_PAYROLL
        value: "True"
      - key: REQUIRE_FIELD_ENCRYPTION_KEY
        value: "True"
      # Set FIELD_ENCRYPTION_KEY manually in the Render dashboard (do not commit).
      - key: RENDER_SERVICE_NAME
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: SEED_ADMIN_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: avvento-hrmis-db
          property: connectionString
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_PORT
        value: "587"
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.1"
      # Set these manually in the Render dashboard after first sync:
      # EMAIL_HOST, EMAIL_HOST_USER, EMAIL_HOST_PASSWORD,
      # DEFAULT_FROM_EMAIL, HR_NOTIFY_EMAIL, SENTRY_DSN

  - type: web
    name: human-resource-management-system-staging
    runtime: python
    plan: free
    branch: main
    buildCommand: bash scripts/render-build.sh
    preDeployCommand: >-
      python manage.py migrate --noinput &&
      python manage.py bootstrap_admin &&
      python manage.py seed_workflows &&
      python manage.py seed_document_access
    startCommand: gunicorn avvento_hrmis.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/v1/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: ALLOW_PUBLIC_REGISTRATION
        value: "False"
      - key: ENFORCE_MFA_FOR_ADMINS
        value: "True"
      - key: ENFORCE_MFA_FOR_MANAGERS
        value: "True"
      - key: ENFORCE_MFA_FOR_PAYROLL
        value: "True"
      - key: REQUIRE_FIELD_ENCRYPTION_KEY
        value: "True"
      - key: RENDER_SERVICE_NAME
        value: staging
      - key: SECRET_KEY
        generateValue: true
      - key: SEED_ADMIN_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: avvento-hrmis-db-staging
          property: connectionString
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_PORT
        value: "587"
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.1"
      # Set manually: EMAIL_HOST, EMAIL_HOST_USER, EMAIL_HOST_PASSWORD,
      # DEFAULT_FROM_EMAIL, HR_NOTIFY_EMAIL, SENTRY_DSN (optional on staging)

  - type: worker
    name: hrmis-qcluster
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py qcluster
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: avvento-hrmis-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

  # Scheduled maintenance (Render Cron Jobs)
  - type: cron
    name: hrmis-daily-scheduled-reports
    runtime: python
    schedule: "0 7 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py run_scheduled_tasks --skip-backup
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: avvento-hrmis-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

  - type: cron
    name: hrmis-monthly-tasks
    runtime: python
    schedule: "0 6 1 * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py run_scheduled_tasks --skip-backup
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: avvento-hrmis-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

  - type: cron
    name: hrmis-weekly-backup
    runtime: python
    schedule: "0 5 * * 0"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py backup_database && python manage.py verify_backup
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: ENCRYPT_BACKUPS
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: avvento-hrmis-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      # Set FIELD_ENCRYPTION_KEY and optional BACKUP_S3_* in dashboard.

  - type: cron
    name: hrmis-annual-holidays
    runtime: python
    schedule: "0 7 1 1 *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py seed_uganda_holidays
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: avvento-hrmis-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: avvento-hrmis-db
    plan: free
  - name: avvento-hrmis-db-staging
    plan: free
