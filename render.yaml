services:
  - type: web
    name: human-resource-management-system
    runtime: python
    plan: free
    buildCommand: >-
      pip install -r requirements.txt &&
      cd frontend && npm install && npm run build && cd .. &&
      python manage.py collectstatic --noinput
    preDeployCommand: >-
      python manage.py migrate --noinput &&
      python manage.py seed_data --reset-password &&
      python manage.py seed_workflows
    startCommand: gunicorn avvento_hrmis.wsgi:application
    healthCheckPath: /api/v1/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: ALLOW_PUBLIC_REGISTRATION
        value: "False"
      - key: ENFORCE_MFA_FOR_ADMINS
        value: "True"
      - key: RENDER_SERVICE_NAME
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: SEED_ADMIN_PASSWORD
        generateValue: true
      - key: SEED_MANAGER_PASSWORD
        generateValue: true
      - key: SEED_EMPLOYEE_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: avvento-hrmis-db
          property: connectionString
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_PORT
        value: "587"
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.1"
      # Set these manually in the Render dashboard after first sync:
      # EMAIL_HOST, EMAIL_HOST_USER, EMAIL_HOST_PASSWORD,
      # DEFAULT_FROM_EMAIL, HR_NOTIFY_EMAIL, SENTRY_DSN

  - type: web
    name: human-resource-management-system-staging
    runtime: python
    plan: free
    branch: main
    buildCommand: >-
      pip install -r requirements.txt &&
      cd frontend && npm install && npm run build && cd .. &&
      python manage.py collectstatic --noinput
    preDeployCommand: >-
      python manage.py migrate --noinput &&
      python manage.py seed_data --reset-password &&
      python manage.py seed_workflows
    startCommand: gunicorn avvento_hrmis.wsgi:application
    healthCheckPath: /api/v1/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "True"
      - key: ALLOW_PUBLIC_REGISTRATION
        value: "False"
      - key: ENFORCE_MFA_FOR_ADMINS
        value: "True"
      - key: RENDER_SERVICE_NAME
        value: staging
      - key: SECRET_KEY
        generateValue: true
      - key: SEED_ADMIN_PASSWORD
        generateValue: true
      - key: SEED_MANAGER_PASSWORD
        generateValue: true
      - key: SEED_EMPLOYEE_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: avvento-hrmis-db-staging
          property: connectionString
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_PORT
        value: "587"
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.1"
      # Set manually: EMAIL_HOST, EMAIL_HOST_USER, EMAIL_HOST_PASSWORD,
      # DEFAULT_FROM_EMAIL, HR_NOTIFY_EMAIL, SENTRY_DSN (optional on staging)

databases:
  - name: avvento-hrmis-db
    plan: free
  - name: avvento-hrmis-db-staging
    plan: free
