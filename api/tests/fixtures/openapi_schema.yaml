components:
  schemas:
    APIKey:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        prefix:
          type: string
          readOnly: true
        scopes:
          readOnly: true
          description: Capability scopes for this key
        created_by:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        last_used_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - created_by
      - id
      - is_active
      - last_used_at
      - name
      - prefix
      - scopes
    APIKeyCreate:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/ScopesEnum'
          default:
          - read
      required:
      - name
    ActionEnum:
      enum:
      - create
      - update
      - delete
      - approve
      - reject
      - login
      - logout
      - export
      - other
      type: string
      description: |-
        * `create` - Create
        * `update` - Update
        * `delete` - Delete
        * `approve` - Approve
        * `reject` - Reject
        * `login` - Login
        * `logout` - Logout
        * `export` - Export
        * `other` - Other
    AdminUserCreate:
      type: object
      properties:
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 254
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        role:
          type: integer
          nullable: true
        password:
          type: string
          writeOnly: true
          minLength: 8
      required:
      - email
      - password
      - username
    AdminUserUpdate:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        role:
          type: integer
          nullable: true
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        managed_department:
          type: integer
          nullable: true
          description: Department scope for managers without a linked employee profile.
      required:
      - email
    Application:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        job_title:
          type: string
          readOnly: true
        status_display:
          type: string
          readOnly: true
        source_display:
          type: string
          readOnly: true
        full_name:
          type: string
          readOnly: true
        resume_url:
          type: string
          readOnly: true
        approval_status:
          type: string
          readOnly: true
        notes_count:
          type: string
          readOnly: true
        interviews_count:
          type: string
          readOnly: true
        current_stage_label:
          type: string
          readOnly: true
        current_stage_key:
          type: string
          readOnly: true
        onboarding_status:
          type: string
          readOnly: true
        first_name:
          type: string
          maxLength: 50
        last_name:
          type: string
          maxLength: 50
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 20
        cover_letter:
          type: string
        resume:
          type: string
          format: uri
          nullable: true
        status:
          $ref: '#/components/schemas/ApplicationStatusEnum'
        source:
          $ref: '#/components/schemas/ApplicationSourceEnum'
        rating:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        hired_at:
          type: string
          format: date-time
          nullable: true
        applied_on:
          type: string
          format: date-time
          readOnly: true
        eeo_gender:
          type: string
          maxLength: 30
        eeo_ethnicity:
          type: string
          maxLength: 60
        eeo_veteran_status:
          type: string
          maxLength: 40
        eeo_disability_status:
          type: string
          maxLength: 40
        job:
          type: integer
        current_stage:
          type: integer
          nullable: true
        employee:
          type: integer
          nullable: true
      required:
      - applied_on
      - approval_status
      - current_stage_key
      - current_stage_label
      - email
      - first_name
      - full_name
      - id
      - interviews_count
